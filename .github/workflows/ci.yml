name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Backend and safety regressions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rsync zstd

      - name: Check Python syntax
        run: python3 -m py_compile src/omarchy_backup/*.py src/omarchy-backup

      - name: Run Python regression tests with isolated fake remotes
        run: python3 -m unittest discover -s tests -v

  secrets:
    name: Scan repository for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan with Gitleaks
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git --redact --log-opts=--all .
